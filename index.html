<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Expense Tracker</h1>

        
        <div class="input-section">
            <input type="text" id="expense-name" placeholder="Expense Name (e.g., Books, Lunch)">
            <input type="number" id="expense-amount" placeholder="Amount (₹)">
            
            <select id="expense-category">
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

            <button id="add-btn">Add Expense</button>
        </div>

        
        <div class="filter-section">
            <label for="filter-category">Filter by Category:</label>
            <select id="filter-category">
                <option value="All">All</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="total-box">
            Total Spent: ₹<span id="total-amount">0</span>
        </div>

        
        <ul id="expense-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
